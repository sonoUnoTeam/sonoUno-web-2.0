<!-- GESTIÓN DE MARCADORES -->
<div class="card-body p-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0 text-success">
            <i class="fas fa-map-marker-alt me-1"></i> Marcadores de Puntos
        </h6>
        <span class="badge bg-success-subtle text-success border" id="tabMarkerBadge">0 puntos</span>
    </div>

    <!-- Lista de Marcadores -->
    <div class="card bg-light border-0 mb-3" style="max-height: 200px; overflow-y: auto;">
        <div class="p-2" id="markersListContainer">
            <p class="text-muted small text-center my-3 mb-0" id="noMarkersMsg">
                <i class="bi bi-bookmark-plus text-secondary fs-5 d-block mb-1"></i>
                No hay marcadores aún.<br>Haz clic en la gráfica o pulsa <strong>M+</strong>.
            </p>
            <table class="table table-sm table-borderless small mb-0 d-none" id="markersTable">
                <thead>
                    <tr class="border-bottom">
                        <th>#</th>
                        <th>X</th>
                        <th>Y</th>
                        <th class="text-end">Acción</th>
                    </tr>
                </thead>
                <tbody id="markersTableBody">
                    <!-- Dinámico por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Acciones de Marcadores -->
    <div class="d-grid gap-2">
        <button type="button" id="btnExportMarkersCsv" class="btn btn-outline-success btn-sm">
            <i class="fas fa-file-csv me-1"></i> Descargar Marcadores (.CSV)
        </button>
        <button type="button" id="btnClearAllMarkers" class="btn btn-outline-danger btn-sm">
            <i class="fas fa-trash-alt me-1"></i> Eliminar Todos los Marcadores
        </button>
    </div>
</div>
