<!-- GESTIÓN DE MARCADORES Y PUNTOS CLAVE -->
<div class="card-body p-3">
    <div class="section-header-badge">
        <h6 class="text-dark d-flex align-items-center gap-2">
            <i class="fas fa-map-marker-alt text-danger"></i>
            <span>Marcadores de Puntos</span>
        </h6>
        <span class="sw-badge-tag" id="tabMarkerBadge" style="background: var(--sw-rose-bg); color: var(--sw-rose-text); border: 1px solid var(--sw-rose-border);">
            0 puntos
        </span>
    </div>

    <!-- Lista de Marcadores -->
    <div class="sw-subcard p-2 mb-3" style="max-height: 220px; overflow-y: auto;">
        <div id="markersListContainer">
            <div class="text-muted small text-center my-3" id="noMarkersMsg">
                <i class="bi bi-bookmark-plus text-secondary fs-4 d-block mb-1 opacity-75"></i>
                <span>No hay marcadores anotados.</span>
                <div class="text-secondary opacity-75" style="font-size: 0.75rem;">Haz clic en la gráfica o pulsa <strong>M+</strong>.</div>
            </div>
            <table class="table table-sm table-hover align-middle small mb-0 d-none" id="markersTable">
                <thead>
                    <tr class="text-muted border-bottom" style="font-size: 0.75rem;">
                        <th class="fw-semibold">#</th>
                        <th class="fw-semibold">Eje X</th>
                        <th class="fw-semibold">Eje Y</th>
                        <th class="fw-semibold text-end">Acción</th>
                    </tr>
                </thead>
                <tbody id="markersTableBody">
                    <!-- Filas insertadas dinámicamente por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Acciones de Marcadores -->
    <div class="d-grid gap-2">
        <button type="button" id="btnExportMarkersCsv" class="btn btn-outline-success btn-sm fw-semibold">
            <i class="fas fa-file-csv me-1"></i> Descargar Marcadores (.CSV)
        </button>
        <button type="button" id="btnClearAllMarkers" class="btn btn-outline-danger btn-sm fw-semibold">
            <i class="fas fa-trash-alt me-1"></i> Eliminar Todos los Marcadores
        </button>
    </div>
</div>
