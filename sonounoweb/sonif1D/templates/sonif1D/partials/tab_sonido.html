<!-- CONFIGURACIÓN DE SONIDO Y PROCESAMIENTO ACÚSTICO (AJAX) -->
<div class="card-body p-3">
    <!-- SECCIÓN 1: CONFIGURACIÓN DE SONIDO -->
    <div class="section-header-badge">
        <h6 class="text-dark d-flex align-items-center gap-2">
            <i class="fas fa-sliders-h text-primary"></i>
            <span>Configuración de sonido</span>
        </h6>
    </div>

    <form id="formSonidoConfig" novalidate onsubmit="return false;">
        <!-- Selección de Timbre -->
        <div class="sw-subcard mb-3">
            <div class="mb-2">
                <label for="instrumento" class="form-label sw-label">
                    <i class="fas fa-wave-square text-secondary me-1"></i> Timbre / Instrumento:
                </label>
                <select id="instrumento" class="form-select form-select-sm">
                    <option value="sine" selected>Seno Pura (Onda Pura)</option>
                    <option value="synthwave">Synthwave (Sintetizador)</option>
                    <option value="flute">Flauta</option>
                    <option value="piano">Piano</option>
                    <option value="celesta">Celesta</option>
                    <option value="pipe organ">Órgano de tubos</option>
                </select>
                <div class="invalid-feedback" id="val_msg_instrumento">Selecciona un instrumento válido.</div>
            </div>

            <!-- Rango de Frecuencias -->
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label for="min_freq" class="form-label sw-label">
                        <i class="fas fa-arrow-down text-secondary me-1"></i> Mín (Hz):
                    </label>
                    <input type="number" id="min_freq" class="form-control form-control-sm" value="500" min="20" max="20000" step="10" required>
                    <div class="invalid-feedback" id="val_msg_min_freq">Mín: 20 Hz a 20,000 Hz.</div>
                </div>
                <div class="col-6">
                    <label for="max_freq" class="form-label sw-label">
                        <i class="fas fa-arrow-up text-secondary me-1"></i> Máx (Hz):
                    </label>
                    <input type="number" id="max_freq" class="form-control form-control-sm" value="5000" min="20" max="20000" step="10" required>
                    <div class="invalid-feedback" id="val_msg_max_freq">Máx: 20 Hz a 20,000 Hz.</div>
                </div>
            </div>

            <!-- Escala logarítmica -->
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="logscale">
                <label class="form-check-label sw-label mb-0" for="logscale">
                    <i class="fas fa-chart-line text-secondary me-1"></i> Frecuencia Logarítmica
                </label>
            </div>
        </div>

        <!-- Botón de compilación de sonido -->
        <div class="d-grid mb-2">
            <button type="button" id="btnSonidoAjax" class="btn btn-sm text-white fw-semibold" style="background: var(--sw-indigo-accent);">
                <i class="fas fa-volume-up me-1"></i> Compilar y Aplicar Sonido
            </button>
        </div>

        <div id="sonidoFeedback" class="alert alert-info small py-2 px-2 mb-3 text-center rounded" style="display: none;">
            <i class="fas fa-check-circle me-1"></i> <span id="sonidoFeedbackText">Sonido sintetizado correctamente</span>
        </div>
    </form>

    <!-- SECCIÓN 2: SUAVIZADO DE SEÑAL -->
    <div class="section-header-badge mt-2">
        <h6 class="text-dark d-flex align-items-center gap-2">
            <i class="fas fa-filter text-warning"></i>
            <span>Suavizado de Señal</span>
        </h6>
    </div>

    <form id="formSuavizadoConfig" novalidate onsubmit="return false;">
        <div class="sw-subcard">
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label for="window_size" class="form-label sw-label" title="Debe ser impar">Ventana (impar):</label>
                    <input type="number" id="window_size" class="form-control form-control-sm" value="31" min="3" max="1001" step="2" required>
                    <div class="invalid-feedback" id="val_msg_window_size">Número impar &ge; 3.</div>
                </div>
                <div class="col-6">
                    <label for="order" class="form-label sw-label">Orden polinomio:</label>
                    <input type="number" id="order" class="form-control form-control-sm" value="4" min="1" max="10" step="1" required>
                    <div class="invalid-feedback" id="val_msg_order">Entero entre 1 y 10.</div>
                </div>
            </div>
            <button type="button" id="btnSuavizarAjax" class="btn btn-outline-warning btn-sm w-100 fw-bold text-dark">
                <i class="fas fa-magic me-1"></i> Aplicar Filtro Suavizado
            </button>
        </div>

        <div id="matematicaFeedback" class="alert alert-success small py-2 px-2 mt-2 mb-0 text-center rounded" style="display: none;">
            <i class="fas fa-check-circle me-1"></i> <span id="matematicaFeedbackText">Señal filtrada correctamente</span>
        </div>
    </form>
</div>
<!-- LÓGICA AJAX PARA EL SONIDO Y SUAVIZADO -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    
    // Función auxiliar para mostrar los carteles de feedback
    function mostrarFeedback(elementId, mensaje) {
        const feedbackEl = document.getElementById(elementId);
        const textEl = document.getElementById(elementId + 'Text');
        if (feedbackEl && textEl) {
            textEl.textContent = mensaje;
            feedbackEl.style.display = 'block';
            setTimeout(() => { feedbackEl.style.display = 'none'; }, 4000);
        }
    }

    // Restaurar los valores visuales del sonido si recargan la página
    const savedWaveform = sessionStorage.getItem('saved_wave');
    if (savedWaveform) {
        document.getElementById('instrumento').value = savedWaveform;
        document.getElementById('min_freq').value = sessionStorage.getItem('saved_min');
        document.getElementById('max_freq').value = sessionStorage.getItem('saved_max');
    }

    // ==========================================
    // 1. LÓGICA DE SONIDO
    // ==========================================
    const btnSonido = document.getElementById('btnSonidoAjax');
    if (btnSonido) {
        btnSonido.addEventListener('click', function(e) {
            e.preventDefault(); 
            
            const form = document.getElementById('formSonidoConfig');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            
            // Buscar el input de datos directo del sessionStorage
            let datosAEnviar = sessionStorage.getItem('data_json');
            
            if (!datosAEnviar) { 
                alert('No hay datos cargados para sonorizar.'); 
                return; 
            }

            const instrumento = document.getElementById('instrumento').value;
            const minFreq = document.getElementById('min_freq').value;
            const maxFreq = document.getElementById('max_freq').value;
            const logscale = document.getElementById('logscale').checked;

            // Guardar en memoria para que las matemáticas lo lean después
            sessionStorage.setItem('saved_wave', instrumento);
            sessionStorage.setItem('saved_min', minFreq);
            sessionStorage.setItem('saved_max', maxFreq);

            const payload = {
                data_json: datosAEnviar, 
                waveform: instrumento, 
                min_freq: parseFloat(minFreq), 
                max_freq: parseFloat(maxFreq), 
                logscale: logscale 
            };

            const originalText = btnSonido.innerHTML;
            btnSonido.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Compilando...';
            btnSonido.disabled = true;

            fetch("{% url 'sonif1D:configurar_sonido' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const audioPlayer = document.querySelector('audio'); 
                    if (audioPlayer) {
                        audioPlayer.src = "data:audio/wav;base64," + data.audio_base64;
                        audioPlayer.load();
                    }
                    mostrarFeedback('sonidoFeedback', 'Sonido sintetizado correctamente');
                } else { alert("Error: " + data.error); }
            })
            .catch(err => console.error("Error AJAX sonido:", err))
            .finally(() => { btnSonido.innerHTML = originalText; btnSonido.disabled = false; });
        });
    }

    // ==========================================
    // 2. LÓGICA DE SUAVIZADO
    // ==========================================
    const btnSuavizar = document.getElementById('btnSuavizarAjax');
    if (btnSuavizar) {
        btnSuavizar.addEventListener('click', function(e) {
            e.preventDefault(); 
            
            const form = document.getElementById('formSuavizadoConfig');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            // Buscar el input de datos directo del sessionStorage
            let datosAEnviar = sessionStorage.getItem('data_json');
            if (!datosAEnviar) { 
                alert('No hay datos cargados para suavizar.'); 
                return; 
            }

            const windowSize = document.getElementById('window_size').value;
            const order = document.getElementById('order').value;
            
            // Leemos el sonido actual para mantenerlo
            const instrumento = document.getElementById('instrumento').value;
            const minFreq = document.getElementById('min_freq').value;
            const maxFreq = document.getElementById('max_freq').value;

            const payload = {
                data_json: datosAEnviar, 
                window_size: parseInt(windowSize), 
                order: parseInt(order),
                waveform: instrumento,
                min_freq: parseFloat(minFreq),
                max_freq: parseFloat(maxFreq)
            };

            const originalText = btnSuavizar.innerHTML;
            btnSuavizar.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Procesando...';
            btnSuavizar.disabled = true;

            fetch("{% url 'sonif1D:aplicar_filtro' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Actualizamos los datos
                    sessionStorage.setItem('data_json', data.data_json);
                    
                    const audioPlayer = document.querySelector('audio'); 
                    if (audioPlayer) {
                        audioPlayer.src = "data:audio/wav;base64," + data.audio_base64;
                        audioPlayer.load();
                    }

                    // Actualizamos el gráfico
                    const dataParsed = JSON.parse(data.data_json);
                    const graficoDiv = document.getElementById('grafico');
                    if (graficoDiv && typeof Plotly !== 'undefined') {
                        Plotly.restyle(graficoDiv, {
                            x: [dataParsed.map(row => row[0])],
                            y: [dataParsed.map(row => row[1])]
                        }, [0]);
                    }
                    
                    mostrarFeedback('matematicaFeedback', 'Señal filtrada correctamente');
                } else {
                    alert("Error al suavizar: " + data.error);
                }
            })
            .catch(error => console.error("Error AJAX:", error))
            .finally(() => { btnSuavizar.innerHTML = originalText; btnSuavizar.disabled = false; });
        });
    }
});
</script>
