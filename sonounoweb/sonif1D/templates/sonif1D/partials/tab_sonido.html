<!-- CONFIGURACIÓN DE SONIDO Y PROCESAMIENTO (AJAX) -->
<div class="card-body p-3">
    <!-- SECCIÓN 1: SÍNTESIS Y TIMBRE -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0 text-info">
            <i class="fas fa-music me-1"></i> Síntesis y Sonificación
        </h6>
        <span class="badge bg-info-subtle text-info border">Audio WAV</span>
    </div>

    <!-- Selección de Instrumento -->
    <div class="mb-3">
        <label for="instrumento" class="form-label small fw-bold mb-1">
            <i class="fas fa-sliders-h text-secondary me-1"></i> Timbre / Instrumento:
        </label>
        <select id="instrumento" class="form-select form-select-sm">
            <option value="sine" selected>Seno Pura (Básico)</option>
            <option value="synthwave">Synthwave (Sintetizador)</option>
            <option value="flute">Flauta</option>
            <option value="piano">Piano</option>
            <option value="celesta">Celesta</option>
            <option value="pipe organ">Órgano de tubos</option>
        </select>
    </div>

    <!-- Rango de Frecuencias -->
    <div class="row g-2 mb-3">
        <div class="col-6">
            <label for="min_freq" class="form-label small fw-bold mb-1">
                <i class="fas fa-arrow-down text-secondary me-1"></i> Mín (Hz):
            </label>
            <input type="number" id="min_freq" class="form-control form-control-sm" value="500" min="50" max="10000" step="50">
        </div>
        <div class="col-6">
            <label for="max_freq" class="form-label small fw-bold mb-1">
                <i class="fas fa-arrow-up text-secondary me-1"></i> Máx (Hz):
            </label>
            <input type="number" id="max_freq" class="form-control form-control-sm" value="5000" min="100" max="20000" step="100">
        </div>
    </div>

    <!-- Escala logarítmica -->
    <div class="card bg-light border-0 p-2 mb-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="logscale">
            <label class="form-check-label small fw-bold" for="logscale">
                <i class="fas fa-chart-line text-secondary me-1"></i> Escala de frecuencia logarítmica
            </label>
        </div>
        <small class="text-muted ps-4" style="font-size: 0.75rem;">
            Ideal para datos con variaciones exponenciales o rangos amplios.
        </small>
    </div>

    <!-- Botón de compilación de sonido -->
    <div class="d-grid mb-3">
        <button type="button" id="btnSonidoAjax" class="btn btn-info text-white btn-sm">
            <i class="fas fa-volume-up me-1"></i> Compilar y Aplicar Sonido
        </button>
    </div>

    <div id="sonidoFeedback" class="alert alert-info small py-1 px-2 mb-3 text-center" style="display: none;">
        <i class="fas fa-check-circle me-1"></i> Sonido sintetizado correctamente
    </div>

    <hr class="my-3">

    <!-- SECCIÓN 2: SUAVIZADO DE SEÑAL -->
    <div class="d-flex align-items-center justify-content-between mb-2">
        <h6 class="fw-bold mb-0 text-warning text-darken">
            <i class="fas fa-magic text-warning me-1"></i> Suavizado de Señal
        </h6>
        <span class="badge bg-warning-subtle text-dark border">Savitzky-Golay</span>
    </div>

    <div class="card border-light-subtle bg-light p-2 mb-2">
        <div class="row g-2 mb-2">
            <div class="col-6">
                <label for="window_size" class="form-label small fw-bold mb-1">Ventana:</label>
                <input type="number" id="window_size" class="form-control form-control-sm" value="31" min="5" step="2">
                <small class="text-muted" style="font-size: 0.7rem;">Debe ser impar</small>
            </div>
            <div class="col-6">
                <label for="order" class="form-label small fw-bold mb-1">Orden:</label>
                <input type="number" id="order" class="form-control form-control-sm" value="4" min="1" max="10">
                <small class="text-muted" style="font-size: 0.7rem;">Polinomio</small>
            </div>
        </div>
        <button type="button" id="btnSuavizarAjax" class="btn btn-warning btn-sm w-100 text-dark fw-bold">
            <i class="fas fa-filter me-1"></i> Aplicar Filtro Suavizado
        </button>
    </div>

    <div id="matematicaFeedback" class="alert alert-success small py-1 px-2 mt-2 mb-0 text-center" style="display: none;">
        <i class="fas fa-check-circle me-1"></i> Señal filtrada correctamente
    </div>
</div>
