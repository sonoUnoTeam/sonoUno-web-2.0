<!-- CONFIGURACIÓN VISUAL DEL GRÁFICO (PLOTLY) -->
<div class="card-body p-3">
    <div class="section-header-badge">
        <h6 class="text-dark d-flex align-items-center gap-2">
            <i class="fas fa-chart-line text-primary"></i>
            <span>Configuración de gráfico</span>
        </h6>
    </div>

    <form id="formVisualConfig" onsubmit="return false;">
        <!-- Título y Ejes -->
        <div class="sw-subcard">
            <div class="mb-2">
                <label for="cfg_name_grafic" class="form-label sw-label">
                    <i class="fas fa-heading text-secondary me-1"></i> Título del Gráfico:
                </label>
                <input type="text" id="cfg_name_grafic" class="form-control form-control-sm" value="Gráfico de Datos" placeholder="Ej: Curva de Luz">
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label for="cfg_name_eje_x" class="form-label sw-label">
                        <i class="fas fa-arrows-alt-h text-secondary me-1"></i> Eje X:
                    </label>
                    <input type="text" id="cfg_name_eje_x" class="form-control form-control-sm" value="Eje X" placeholder="Tiempo (s)">
                </div>
                <div class="col-6">
                    <label for="cfg_name_eje_y" class="form-label sw-label">
                        <i class="fas fa-arrows-alt-v text-secondary me-1"></i> Eje Y:
                    </label>
                    <input type="text" id="cfg_name_eje_y" class="form-control form-control-sm" value="Eje Y" placeholder="Amplitud">
                </div>
            </div>
        </div>

        <!-- Estilo y Color de Trazo -->
        <div class="sw-subcard">
            <div class="row g-2">
                <div class="col-6">
                    <label for="cfg_estilo_linea" class="form-label sw-label">
                        <i class="fas fa-pen-nib text-secondary me-1"></i> Trazo:
                    </label>
                    <select id="cfg_estilo_linea" class="form-select form-select-sm">
                        <option value="solid" selected>Sólido ───</option>
                        <option value="dot">Punteado ···</option>
                        <option value="dash">Guion ──</option>
                        <option value="longdash">Guion Largo —</option>
                        <option value="dashdot">Guion-Punto —·—</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="cfg_color_linea" class="form-label sw-label">
                        <i class="fas fa-palette text-secondary me-1"></i> Color:
                    </label>
                    <select id="cfg_color_linea" class="form-select form-select-sm">
                        <option value="blue" selected>🔵 Azul</option>
                        <option value="red">🔴 Rojo</option>
                        <option value="green">🟢 Verde</option>
                        <option value="purple">🟣 Púrpura</option>
                        <option value="orange">🟠 Naranja</option>
                        <option value="black">⚫ Negro</option>
                        <option value="yellow">🟡 Amarillo</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Modos y Grilla -->
        <div class="sw-subcard">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="cfg_grilla" checked>
                <label class="form-check-label sw-label mb-0" for="cfg_grilla">
                    <i class="fas fa-th me-1 text-secondary"></i> Cuadrícula y grilla
                </label>
            </div>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="cfg_escala_grises">
                <label class="form-check-label sw-label mb-0" for="cfg_escala_grises">
                    <i class="fas fa-adjust me-1 text-secondary"></i> Alto contraste / Escala de grises
                </label>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-grid gap-2">
            <button type="button" id="btnAplicarVisual" class="btn btn-primary btn-sm fw-semibold">
                <i class="fas fa-check-circle me-1"></i> Aplicar al Gráfico
            </button>
            <button type="button" id="btnRestablecerVisual" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-undo me-1"></i> Restablecer Valores
            </button>
        </div>

        <div id="visualFeedback" class="alert alert-success small py-2 px-2 mt-2 mb-0 text-center rounded" style="display: none;">
            <i class="fas fa-check-circle me-1"></i> Visualización actualizada en tiempo real
        </div>
    </form>
</div>
