<!-- CONFIGURACIÓN VISUAL DEL GRÁFICO (PLOTLY) -->
<div class="card-body p-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0 text-primary">
            <i class="fas fa-palette me-1"></i> Visualización del Gráfico
        </h6>
        <span class="badge bg-primary-subtle text-primary border">En vivo</span>
    </div>

    <form id="formVisualConfig" onsubmit="return false;">
        <!-- Título y Ejes -->
        <div class="mb-3">
            <label for="cfg_name_grafic" class="form-label small fw-bold mb-1">
                <i class="fas fa-heading text-secondary me-1"></i> Título del Gráfico:
            </label>
            <input type="text" id="cfg_name_grafic" class="form-control form-control-sm" value="Gráfico de Datos" placeholder="Ej: Curva de Luz">
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <label for="cfg_name_eje_x" class="form-label small fw-bold mb-1">
                    <i class="fas fa-arrows-alt-h text-secondary me-1"></i> Eje X:
                </label>
                <input type="text" id="cfg_name_eje_x" class="form-control form-control-sm" value="Eje X" placeholder="Tiempo (s)">
            </div>
            <div class="col-6">
                <label for="cfg_name_eje_y" class="form-label small fw-bold mb-1">
                    <i class="fas fa-arrows-alt-v text-secondary me-1"></i> Eje Y:
                </label>
                <input type="text" id="cfg_name_eje_y" class="form-control form-control-sm" value="Eje Y" placeholder="Amplitud">
            </div>
        </div>

        <!-- Estilo y Color de Línea -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <label for="cfg_estilo_linea" class="form-label small fw-bold mb-1">
                    <i class="fas fa-pen-nib text-secondary me-1"></i> Trazo:
                </label>
                <select id="cfg_estilo_linea" class="form-select form-select-sm">
                    <option value="solid" selected>Sólido</option>
                    <option value="dot">Punteado</option>
                    <option value="dash">Guion</option>
                    <option value="longdash">Guion Largo</option>
                    <option value="dashdot">Guion-Punto</option>
                </select>
            </div>
            <div class="col-6">
                <label for="cfg_color_linea" class="form-label small fw-bold mb-1">
                    <i class="fas fa-tint text-secondary me-1"></i> Color:
                </label>
                <select id="cfg_color_linea" class="form-select form-select-sm">
                    <option value="blue" selected>Azul</option>
                    <option value="red">Rojo</option>
                    <option value="green">Verde</option>
                    <option value="purple">Púrpura</option>
                    <option value="orange">Naranja</option>
                    <option value="black">Negro</option>
                    <option value="yellow">Amarillo</option>
                </select>
            </div>
        </div>

        <!-- Opciones Rápidas (Grilla y Escala de Grises) -->
        <div class="card bg-light border-0 p-2 mb-3">
            <div class="form-check form-switch mb-1">
                <input class="form-check-input" type="checkbox" id="cfg_grilla" checked>
                <label class="form-check-label small fw-bold" for="cfg_grilla">
                    <i class="fas fa-th me-1 text-secondary"></i> Mostrar cuadrícula
                </label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="cfg_escala_grises">
                <label class="form-check-label small fw-bold" for="cfg_escala_grises">
                    <i class="fas fa-adjust me-1 text-secondary"></i> Modo alto contraste / gris
                </label>
            </div>
        </div>

        <!-- Acciones -->
        <div class="d-grid gap-2">
            <button type="button" id="btnAplicarVisual" class="btn btn-primary btn-sm">
                <i class="fas fa-check-circle me-1"></i> Aplicar al Gráfico
            </button>
            <button type="button" id="btnRestablecerVisual" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-undo me-1"></i> Restablecer valores
            </button>
        </div>

        <div id="visualFeedback" class="alert alert-success small py-1 px-2 mt-2 mb-0 text-center" style="display: none;">
            <i class="fas fa-check me-1"></i> Cambios aplicados con éxito
        </div>
    </form>
</div>
