{% load i18n %}
<!-- CONFIGURACIÓN VISUAL DEL GRÁFICO (PLOTLY) -->
<div class="card-body p-3">
    <div class="section-header-badge">
        <h6 class="text-dark d-flex align-items-center gap-2">
            <i class="fas fa-chart-line text-primary"></i>
            <span>{% trans "Configuración de gráfico" %}</span>
        </h6>
    </div>

    <form id="formVisualConfig" novalidate onsubmit="return false;">
        <!-- Título y Ejes -->
        <div class="sw-subcard">
            <div class="mb-2">
                <label for="cfg_name_grafic" class="form-label sw-label">
                    <i class="fas fa-heading text-secondary me-1"></i> {% trans "Título del Gráfico" %}:
                </label>
                <input type="text" id="cfg_name_grafic" class="form-control form-control-sm" value="Gráfico de Datos" placeholder="Ej: Curva de Luz" maxlength="100">
                <div class="invalid-feedback" id="val_msg_name_grafic">{% trans "El título no puede exceder 100 caracteres." %}</div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label for="cfg_name_eje_x" class="form-label sw-label">
                        <i class="fas fa-arrows-alt-h text-secondary me-1"></i> {% trans "Eje X" %}:
                    </label>
                    <input type="text" id="cfg_name_eje_x" class="form-control form-control-sm" value="Eje X" placeholder="Tiempo (s)" maxlength="50">
                    <div class="invalid-feedback" id="val_msg_eje_x">{% trans "Máximo 50 caracteres." %}</div>
                </div>
                <div class="col-6">
                    <label for="cfg_name_eje_y" class="form-label sw-label">
                        <i class="fas fa-arrows-alt-v text-secondary me-1"></i> {% trans "Eje Y" %}:
                    </label>
                    <input type="text" id="cfg_name_eje_y" class="form-control form-control-sm" value="Eje Y" placeholder="Amplitud" maxlength="50">
                    <div class="invalid-feedback" id="val_msg_eje_y">{% trans "Máximo 50 caracteres." %}</div>
                </div>
            </div>
        </div>

        <!-- Estilo y Color de Trazo -->
        <div class="sw-subcard">
            <div class="row g-2">
                <div class="col-6">
                    <label for="cfg_estilo_linea" class="form-label sw-label">
                        <i class="fas fa-pen-nib text-secondary me-1"></i> {% trans "Trazo" %}:
                    </label>
                    <select id="cfg_estilo_linea" class="form-select form-select-sm">
                        <option value="solid" selected>{% trans "Sólido" %} ───</option>
                        <option value="dot">{% trans "Punteado" %} ···</option>
                        <option value="dash">{% trans "Guion" %} ──</option>
                        <option value="longdash">{% trans "Guion Largo" %} —</option>
                        <option value="dashdot">{% trans "Guion-Punto" %} —·—</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="cfg_color_linea" class="form-label sw-label">
                        <i class="fas fa-palette text-secondary me-1"></i> {% trans "Color" %}:
                    </label>
                    <select id="cfg_color_linea" class="form-select form-select-sm">
                        <option value="blue" selected>🔵 {% trans "Azul" %}</option>
                        <option value="red">🔴 {% trans "Rojo" %}</option>
                        <option value="green">🟢 {% trans "Verde" %}</option>
                        <option value="purple">🟣 {% trans "Púrpura" %}</option>
                        <option value="orange">🟠 {% trans "Naranja" %}</option>
                        <option value="black">⚫ {% trans "Negro" %}</option>
                        <option value="yellow">🟡 {% trans "Amarillo" %}</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Modos y Grilla -->
        <div class="sw-subcard">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="cfg_grilla" checked>
                <label class="form-check-label sw-label mb-0" for="cfg_grilla">
                    <i class="fas fa-th me-1 text-secondary"></i> {% trans "Cuadrícula y grilla" %}
                </label>
            </div>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="cfg_escala_grises">
                <label class="form-check-label sw-label mb-0" for="cfg_escala_grises">
                    <i class="fas fa-adjust me-1 text-secondary"></i> {% trans "Alto contraste / Escala de grises" %}
                </label>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-grid gap-2">
            <button type="button" id="btnAplicarVisual" class="btn btn-primary btn-sm fw-semibold">
                <i class="fas fa-check-circle me-1"></i> {% trans "Aplicar al Gráfico" %}
            </button>
            <button type="button" id="btnRestablecerVisual" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-undo me-1"></i> {% trans "Restablecer Valores" %}
            </button>
        </div>

        <div id="visualFeedback" class="alert alert-success small py-2 px-2 mt-2 mb-0 text-center rounded" style="display: none;">
            <i class="fas fa-check-circle me-1"></i> {% trans "Visualización actualizada en tiempo real" %}
        </div>
    </form>
</div>
