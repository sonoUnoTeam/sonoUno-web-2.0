{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sonoUno web{% endblock %}</title>

    <!-- Favicon: -->
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="48x48">
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS de Navbar -->
    <link rel="stylesheet" href="{% static 'muongraphy/navbar_styles.css' %}">
    <!-- CSS de la app -->
    <link rel="stylesheet" href="{% static 'muongraphy/css/muongraphy.css' %}">
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Se incluye la navbar -->
    {% include 'muongraphy/navbar.html' %}

    <main class="container my-4 muon-main">
        <!-- Se incluye mensajes -->
        {% include 'muongraphy/message.html' %}

        <!-- Aviso mientras el servidor genera el video de un ejemplo -->
        <div id="muonStatus" class="muon-status" role="status" aria-live="polite"></div>

        <div class="row g-4">
            {% block content %}
            {% endblock content %}
        </div>
    </main>

    <script src="{% static 'muongraphy/js/muongraphy-player.js' %}"></script>
</body>
</html>
